[package]
name = "ghostline-vehicles"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native Cyberpunk 2077 vehicle catalogue, comparisons and GPU previews"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ghostline-red = { git = "https://github.com/ghostline77/ghostline-red" }
ghostline-renderer = { git = "https://github.com/ghostline77/renderer" }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
